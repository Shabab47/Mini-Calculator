name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 -mwindows -municode -static calculator.cpp -o calculator.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-windows
          path: calculator.exe

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: calculator.exe